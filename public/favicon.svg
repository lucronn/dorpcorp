<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="eventHorizon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="70%" stop-color="#050308" />
      <stop offset="90%" stop-color="#1a0b22" />
      <stop offset="100%" stop-color="#3d144c" />
    </radialGradient>
    <radialGradient id="accretionGlow" cx="50%" cy="50%" r="50%">
      <stop offset="20%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="45%" stop-color="#00ffd2" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ff7b00" stop-opacity="0.8" />
      <stop offset="95%" stop-color="#ff1a40" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="jetBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffd2" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#da70d6" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Deep space background circle -->
  <circle cx="32" cy="32" r="30" fill="#040208" stroke="#1f1a2e" stroke-width="1.5" />

  <!-- Outer accretion glow ring -->
  <ellipse cx="32" cy="32" rx="26" ry="11" fill="url(#accretionGlow)" transform="rotate(-22 32 32)" opacity="0.85" />

  <!-- Lensed secondary ring (Einstein ring warp) -->
  <ellipse cx="32" cy="32" rx="19" ry="22" stroke="url(#jetBeam)" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.65" />

  <!-- Relativistic jet axes -->
  <line x1="12" y1="52" x2="52" y2="12" stroke="url(#jetBeam)" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Event Horizon Shadow Core -->
  <circle cx="32" cy="32" r="12" fill="url(#eventHorizon)" stroke="#00ffd2" stroke-width="1.2" />

  <!-- Central singularity spark -->
  <circle cx="32" cy="32" r="2.2" fill="#ffffff" />
</svg>
